
name: GT EXTERNAL - IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Extraer proyecto
        run: |
          mkdir -p source
          unzip -o GT-EXTERNAL-proyecto-actualizado.zip -d source

      - name: Preparar configuración
        run: |
          CONFIG=$(find source -type f \( -name "project.yml" -o -name "Proyecto.yml" \) | head -n 1)

          if [ -z "$CONFIG" ]; then
            echo "No se encontró Proyecto.yml"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$CONFIG")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          grep -n "PRODUCT_BUNDLE_IDENTIFIER\|bundleId" "$CONFIG" || true

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto
        run: |
          cd "$PROJECT_DIR"
          xcodegen generate

      - name: Compilar aplicación
        run: |
          cd "$PROJECT_DIR"
          xcodebuild \
            -project GT-EXTERNAL.xcodeproj \
            -scheme GT-EXTERNAL \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Guardar compilación
        uses: actions/upload-artifact@v4
        with:
          name: GT-EXTERNAL-build
          path: ${{ env.PROJECT_DIR }}/build/Build/Products/Release-iphoneos/


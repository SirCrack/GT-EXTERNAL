name: GT EXTERNAL - IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Extraer proyecto
        run: |
          mkdir -p source
          unzip -o GT-EXTERNAL-proyecto-actualizado.zip -d source

      - name: Encontrar configuración
        run: |
          CONFIG=$(find source -type f \( -name "project.yml" -o -name "Proyecto.yml" \) | head -n 1)
          if [ -z "$CONFIG" ]; then
            echo "No se encontró el archivo de configuración"
            exit 1
          fi
          if [ "$CONFIG" != "$DIR/project.yml" ]; then
  cp "$CONFIG" "$DIR/project.yml"
fi
          cp "$CONFIG" "$DIR/project.yml"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto
        run: |
          cd "$PROJECT_DIR"
          xcodegen generate


name: GT EXTERNAL - Verificar firma

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15

    steps:
      - name: Comprobar secretos
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          test -n "$P12" || { echo "Falta IOS_P12_BASE64"; exit 1; }
          test -n "$PROFILE" || { echo "Falta IOS_MOBILEPROVISION_BASE64"; exit 1; }
          test -n "$PASSWORD" || { echo "Falta IOS_P12_PASSWORD"; exit 1; }
          echo "Los tres secretos están configurados."

      - name: Revisar perfil
        env:
          PROFILE: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          set -e
          echo "$PROFILE" | base64 --decode > profile.mobileprovision
          security cms -D -i profile.mobileprovision > profile.plist

          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" profile.plist)
          TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" profile.plist)

          echo "Equipo: $TEAM"
          echo "Se comprobó el perfil."

          EXPECTED="$TEAM.app.P323S9Q6D3.app.lotus5042.comet881"

          if [ "$APP_ID" = "$EXPECTED" ] || [ "$APP_ID" = "$TEAM.*" ]; then
            echo "Perfil compatible con GT EXTERNAL."
          else
            echo "El identificador no coincide."
            exit 1
          fi

          if /usr/libexec/PlistBuddy -c "Print :ProvisionedDevices" profile.plist >/dev/null 2>&1; then
            echo "Perfil con dispositivos registrados."
          else
            echo "El perfil no contiene una lista de dispositivos."
          fi

      - name: Comprobar certificado
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          set -e
          echo "$P12" | base64 --decode > certificate.p12
          security create-keychain -p temporary build.keychain
          security unlock-keychain -p temporary build.keychain
          security import certificate.p12 \
            -k build.keychain \
            -P "$PASSWORD" \
            -A
          echo "El certificado se pudo importar."

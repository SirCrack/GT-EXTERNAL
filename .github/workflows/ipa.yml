
name: GT EXTERNAL - IPA sin firmar

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer proyecto
        run: |
          set -e
          mkdir -p source
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)
          if [ -z "$ZIP" ]; then
            echo "No se encontró el ZIP del proyecto."
            exit 1
          fi
          unzip -q "$ZIP" -d source

          CONFIG=$(find source \( -iname "project.yml" -o -iname "Proyecto.yml" \) | head -1)
          if [ -z "$CONFIG" ]; then
            echo "No se encontró project.yml."
            exit 1
          fi

          DIR=$(dirname "$CONFIG")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Configuración encontrada: $CONFIG"

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        run: |
          set -e
          cd "$PROJECT_DIR"
          xcodegen generate --spec "$(find . -maxdepth 2 \( -name project.yml -o -name Proyecto.yml \) | head -1)"

      - name: Compilar sin firma
        run: |
          set -e
          PROJECT=$(find "$PROJECT_DIR" -maxdepth 2 -name "*.xcodeproj" | head -1)
          test -n "$PROJECT"

          xcodebuild \
            -project "$PROJECT" \
            -scheme GT-EXTERNAL \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Crear IPA
        run: |
          set -e
          APP=$(find "$GITHUB_WORKSPACE/DerivedData/Build/Products/Release-iphoneos" \
            -maxdepth 1 -name "*.app" -print -quit)

          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "No se encontró la aplicación .app."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/Payload"
          cp -R "$APP" "$GITHUB_WORKSPACE/Payload/"

          cd "$GITHUB_WORKSPACE"
          ditto -c -k --sequesterRsrc --keepParent \
            Payload GT-EXTERNAL-unsigned.ipa

          echo "IPA creada correctamente."

      - name: Guardar IPA
        uses: actions/upload-artifact@v4
        with:
          name: GT-EXTERNAL-IPA
          path: GT-EXTERNAL-unsigned.ipa
          if-no-files-found: error

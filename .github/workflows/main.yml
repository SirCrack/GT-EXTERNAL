name: GT EXTERNAL iOS Build

on:
  workflow_dispatch:
  push:
    paths:
      - "GT-EXTERNAL-proyecto-actualizado.zip"

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Extraer archivos
        run: |
          mkdir source
          unzip -o GT-EXTERNAL-proyecto-actualizado.zip -d source

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Crear proyecto Xcode
        working-directory: source
        run: xcodegen generate

      - name: Compilar
        working-directory: source
        run: |
          xcodebuild \
            -project GT-EXTERNAL.xcodeproj \
            -scheme GT-EXTERNAL \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
